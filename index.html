<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Evergreen Love LLC | Connect</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f5ef;
      color: #2f3e34;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 24px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.10);
    }

    .brand {
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #355e3b;
      margin-bottom: 5px;
    }

    .llc {
      font-size: 15px;
      letter-spacing: 3px;
      color: #777;
      margin-bottom: 25px;
    }

    h2 {
      margin-bottom: 5px;
      font-size: 21px;
    }

    .subtitle {
      color: #777;
      margin-top: 0;
      margin-bottom: 30px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 13px 0;
      border-radius: 12px;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      background: #355e3b;
      color: white;
      transition: 0.2s;
    }

    .button:hover {
      background: #27472c;
      transform: translateY(-2px);
    }

    .catalog {
      background: #8a623d;
    }

    .catalog:hover {
      background: #704d2e;
    }

    .contact {
      margin-top: 28px;
      font-size: 14px;
      line-height: 1.7;
      color: #666;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="brand">EVERGREEN LOVE</div>
    <div class="llc">LLC</div>

    <h2>Myriam Nieves</h2>
    <p class="subtitle">Connect with Evergreen Love</p>

    <a class="button"
       href="tel:+17879601431">
       📞 Call Us
    </a>

    <a class="button"
       href="https://wa.me/17879601431"
       target="_blank">
       💬 WhatsApp
    </a>

    <a class="button"
       href="mailto:evergreenlov@gmail.com">
       ✉️ Email Us
    </a>

    <a class="button catalog"
       href="https://evergreen-love-erp.onrender.com/catalogo_publico.html"
       target="_blank">
       📖 View Product Catalog
    </a>

    <div class="contact">
      (787) 960-1431<br>
      evergreenlov@gmail.com
    </div>

    <div class="footer">
      © Evergreen Love LLC
    </div>

  </div>

</body>
</html>
