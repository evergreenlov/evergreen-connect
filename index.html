<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Evergreen Love LLC | Connect</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4efe5;
  color: #34442f;
  padding: 25px 15px;
}

.card {
  max-width: 520px;
  margin: auto;
  background: #fbf8f0;
  border-radius: 30px;
  padding: 35px 30px 30px;
  text-align: center;
  box-shadow: 0 12px 35px rgba(60,50,35,.12);
}

/* LOGO */

.logo {
  width: 100%;
  max-width: 330px;
  height: auto;
  display: block;
  margin: 0 auto 25px;
  border-radius: 10px;
}

/* NAME */

h1 {
  font-family: Georgia, serif;
  font-size: 32px;
  color: #294232;
  margin: 5px 0 5px;
}

.subtitle {
  font-size: 18px;
  color: #68765b;
  margin: 0 0 30px;
}

/* BUTTONS */

.button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 13px;

  width: 100%;
  min-height: 64px;
  margin: 14px 0;
  padding: 15px 20px;

  border-radius: 17px;

  background: #526b43;
  color: white;

  text-decoration: none;
  font-size: 19px;
  font-weight: 600;

  box-shadow: 0 4px 8px rgba(0,0,0,.08);

  transition: transform .15s ease,
              background .15s ease;
}

.button:hover {
  background: #405636;
  transform: translateY(-2px);
}

.icon {
  font-size: 25px;
}

.catalog {
  background: #a77955;
}

.catalog:hover {
  background: #8d6345;
}

/* CONTACT */

.contact {
  margin-top: 28px;
  font-size: 17px;
  line-height: 2;
  color: #34442f;
}

.contact a {
  color: #34442f;
  text-decoration: none;
}

/* DIVIDER */

.divider {
  width: 55%;
  height: 1px;
  background: #b98661;
  margin: 28px auto 22px;
}

/* FOOTER */

.tagline {
  font-family: Georgia, serif;
  font-size: 20px;
  font-style: italic;
  color: #626b48;
  margin-bottom: 10px;
}

.footer {
  font-size: 13px;
  color: #8a887d;
}

/* MOBILE */

@media (max-width: 480px) {

  body {
    padding: 12px;
  }

  .card {
    padding: 25px 18px;
    border-radius: 24px;
  }

  .logo {
    max-width: 280px;
  }

  h1 {
    font-size: 28px;
  }

  .subtitle {
    font-size: 16px;
  }

  .button {
    min-height: 60px;
    font-size: 18px;
  }
}

</style>
</head>


<body>

<div class="card">

  <!-- EVERGREEN LOVE LOGO -->

  <img
    src="LogoEvergreenLove.jpg"
    alt="Evergreen Love LLC"
    class="logo"
  >


  <!-- CONTACT NAME -->

  <h1>Myriam Nieves</h1>

  <p class="subtitle">
    Connect with Evergreen Love
  </p>


  <!-- CALL -->

  <a
    class="button"
    href="tel:+17879601431"
  >
    <span class="icon">☎</span>
    Call Us
  </a>


  <!-- WHATSAPP -->

  <a
    class="button"
    href="https://wa.me/17879601431"
    target="_blank"
  >
    <span class="icon">💬</span>
    WhatsApp
  </a>


  <!-- EMAIL -->

  <a
    class="button"
    href="mailto:evergreenlov@gmail.com"
  >
    <span class="icon">✉</span>
    Email Us
  </a>


  <!-- CATALOG -->

  <a
    class="button catalog"
    href="https://evergreen-love-erp.onrender.com/catalogo_publico.html"
    target="_blank"
  >
    <span class="icon">▣</span>
    View Product Catalog
  </a>


  <!-- CONTACT INFO -->

  <div class="contact">

    ☎
    <a href="tel:+17879601431">
      (787) 960-1431
    </a>

    <br>

    ✉
    <a href="mailto:evergreenlov@gmail.com">
      evergreenlov@gmail.com
    </a>

  </div>


  <div class="divider"></div>


  <div class="tagline">
    Crafted with Purpose
  </div>


  <div class="footer">
    © Evergreen Love LLC
  </div>

</div>

</body>
</html>
